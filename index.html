/* ---------- audio helpers ---------- */
function toWav16k(samples,srcRate){
  const SR=16000,ratio=srcRate/SR,n=Math.floor(samples.length/ratio);
  const o=new DataView(new ArrayBuffer(44+n*2));
  const w=(p,s)=>{for(let i=0;i<s.length;i++)o.setUint8(p+i,s.charCodeAt(i));};
  w(0,'RIFF');o.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');
  o.setUint32(16,16,true);o.setUint16(20,1,true);o.setUint16(22,1,true);
  o.setUint32(24,SR,true);o.setUint32(28,SR*2,true);o.setUint16(32,2,true);o.setUint16(34,16,true);
  w(36,'data');o.setUint32(40,n*2,true);
  for(let i=0;i<n;i++){const s=Math.max(-1,Math.min(1,samples[Math.floor(i*ratio)]));o.setInt16(44+i*2,s<0?s*0x8000:s*0x7FFF,true);}
  return o.buffer;
}
function b64(buf){let s='';const b=new Uint8Array(buf);for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s);}
async function sendAudio(data){
  const id=Math.random().toString(36).slice(2,8),SZ=60000,n=Math.ceil(data.length/SZ);
  for(let i=0;i<n;i++){const r=await send({type:'audio',id,i,n,data:data.slice(i*SZ,(i+1)*SZ)});if(r!=='ok')log('audio part '+(i+1)+' send: '+r);}
}

/* ---------- translation (runs on the laptop only) ---------- */
async function translate(data,S,target,provisional){
  if(!gkey)throw new Error('Paste your Google AI key first and tap Save');
  const who=S==='host'?'A':'B';
  const talk=history.map(h=>(h.who==='host'?'A':'B')+': '+h.heard).join('\n')||'(this is the start)';
  const alt=same(target,'English')?'Japanese':'English';
  const r1=S==='host'
    ?`Person A speaks only these languages: ${hostList.join(', ')}. Person A may mix them in one sentence, which is fine. If the audio is silence or noise, or mainly in any other language, set accepted to false and leave the other fields empty.`
    :`Person B can speak ANY language, so detect it yourself. If the audio is silence or noise, or mainly in ${hostList.join(' or ')} (those are Person A's languages), set accepted to false and leave the other fields empty.`;
  const r2=provisional?`The listener language is only a guess. If the audio is already in ${target}, translate it into ${alt} instead.`:`Always translate into ${target}.`;
  const prompt=`You are a live interpreter for two people talking face to face. Person A speaks ${hostList.join(' / ')}. Person B speaks ${guestLang||'a language not known yet'} (it may change if someone new talks).
You hear Person ${who}. Translate for the other person into ${target}.

Rules:
1. ${r1}
2. ${r2}
3. Translate the meaning and intent, not word for word. Slang, idioms, jokes and sarcasm must come out as what they mean in this situation. Example: "You are killing it, brother" is praise, so say that they are doing great, never anything about killing. Use the conversation so far to understand what words refer to.
4. Choose the politeness yourself. Judge from how the speaker talks (casual or formal words, tone), what they talk about, and the relationship you can infer (friends, teacher and student, boss and employee, customer and shopkeeper, strangers). When unsure, be polite but friendly. In languages with politeness levels, such as Japanese and Korean, use the level a native speaker would use in that exact relationship. Match the vocabulary level of the speaker.
5. Keep the emotion: show it in wording and punctuation.
6. Judge the speaker from the voice: speaker_gender is male or female, energy is low, medium or high.
7. Write the translation in the normal native script of ${target}.

What the helper agent already knows about this conversation (use it to keep tone consistent): ${JSON.stringify(mem)}

Conversation so far:
${talk}

Reply with JSON only: accepted (true or false), heard, detected_language (English name of the main language), translated_into (English name), translation, translation_lang_code (BCP-47), emotion (one or two words), energy, speaker_gender, register (one or two words like casual, polite, very formal), relationship (one or two words like friends, strangers).`;
  const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+MODEL+':generateContent?key='+gkey,{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({contents:[{parts:[{text:prompt},{inline_data:{mime_type:'audio/wav',data:data}}]}],generationConfig:{responseMimeType:'application/json'}})
  });
  const d=await r.json();
  if(!d.candidates)throw new Error(JSON.stringify(d.error||d));
  let j=JSON.parse(d.candidates[0].content.parts[0].text);
  if(Array.isArray(j))j=j[0];
  return j;
}


/* ---------- background helper agent (never blocks the live translation) ---------- */
async function agentUpdate(){
  if(agentBusy||!gkey||history.length<1)return;
  agentBusy=true;
  try{
    const talk=history.map(h=>(h.who==='host'?'A':'B')+': '+h.heard+' => '+h.translation).join('\n');
    const prompt=`You are a quiet helper agent that watches a live conversation between Person A and Person B who speak different languages. Update your notes.
Current notes: ${JSON.stringify(mem)}
Latest lines:
${talk}
Reply with JSON only: relationship (short, e.g. "friends", "customer and plumber", "student and professor"), formality (casual, polite or formal), summary (one short sentence of what the talk is about), slang (array of up to 4 slang or idioms heard, each as "phrase = meaning"). Keep earlier notes unless the new lines clearly change them.`;
    const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+MODEL+':generateContent?key='+gkey,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{responseMimeType:'application/json'}})});
    const d=await r.json();
    let j=JSON.parse(d.candidates[0].content.parts[0].text);if(Array.isArray(j))j=j[0];
    mem={relationship:j.relationship||mem.relationship,formality:j.formality||mem.formality,summary:j.summary||mem.summary,slang:Array.isArray(j.slang)?j.slang.slice(0,6):mem.slang};
    $('agentCard').style.display='block';
    $('agentNotes').innerHTML=(mem.relationship?'👥 '+mem.relationship+' · '+mem.formality+'<br>':'')+(mem.summary?'📝 '+mem.summary+'<br>':'')+(mem.slang.length?'💬 '+mem.slang.join('<br>💬 '):'');
  }catch(e){log('agent: '+e.message);}
  agentBusy=false;
}

async function handleAudio(data,S){
  const hs=S==='host';
  if(!hs){busy=true;setStatus('Thinking...');}
  const t0=performance.now();
  try{
    const target=hs?(guestLang||(guestHint&&!inList(guestHint,hostList)?guestHint:DEFAULT_OTHER)):(primary||hostList[0]||'English');
    const j=await translate(data,S,target,hs&&!guestLang);
    const det=canon(j.detected_language);
    let ok=(j.accepted===true||j.accepted==='true');
    if(ok&&hs&&!inList(det,hostList))ok=false;
    if(ok&&!hs&&(!det||inList(det,hostList)))ok=false;
    if(ok){
      if(hs){primary=hostList.find(l=>same(l,det))||primary;shareLangs();}
      else if(!same(det,guestLang)){guestLang=det;shareLangs();}
    }
    let gender='';
    if(ok){
      const g=(j.speaker_gender||'').toLowerCase();
      if(g==='male'||g==='female')votes[S][g]++;
      const v=votes[S];
      gender=v.male===v.female?'':(v.male>v.female?'male':'female');
      history.push({who:S,heard:j.heard||'',translation:j.translation||''});
      if(history.length>8)history.shift();
    }
    const into=canon(j.translated_into||target);
    const res={type:'result',speaker:S,accepted:ok,reason:ok?'':(!det?'noise':(hs?'notmine':'theirs')),detected:det,
      heard:j.heard||'',translation:j.translation||'',lang:CODES[into]||j.translation_lang_code||'en-US',
      emotion:j.emotion||'',energy:(j.energy||'medium').toLowerCase(),gender,register:j.register||'',relationship:j.relationship||''};
    showResult(res);
    if(ok)setTimeout(agentUpdate,50);
    $('time').textContent='AI took '+((performance.now()-t0)/1000).toFixed(1)+' seconds';
    send(res);
    if(hs)resumeListening();
    else if(ok&&on)speak(res.translation,res.lang,res);
    else resumeListening();
  }catch(err){
    setStatus('Error: '+err.message);log('ERR '+err.message);
    if(!hs)send({type:'error',text:err.message});
    setTimeout(resumeListening,2500);
  }
}

function showResult(r){
  if(!r.accepted){
    if(r.speaker===myRole){
      const m={notmine:'🚫 '+r.detected+' is not in your languages. Tap ＋ to add it',theirs:'🚫 '+r.detected+' belongs to the other person',noise:'🚫 No clear speech'};
      setStatus(m[r.reason]||m.noise);
      $('heard').textContent='';$('out').textContent='';$('emo').textContent='';$('style').textContent='';
    }
    return;
  }
  $('heard').textContent=(r.speaker===myRole?'You said':'They said')+' ('+r.detected+'): '+r.heard;
  $('out').textContent=r.translation;
  $('emo').textContent=r.emotion?'Feeling: '+r.emotion:'';
  $('style').textContent=(r.register||r.relationship)?'Style: '+(r.register||'?')+(r.relationship?' · '+r.relationship:''):'';
}

/* ---------- voice: male / female matching ---------- */
function pickVoice(lang,gender){
  const vs=speechSynthesis.getVoices();
  const p=(lang||'en').toLowerCase().replace('_','-').split('-')[0];
  const sl=vs.filter(v=>(v.lang||'').toLowerCase().replace('_','-').split('-')[0]===p);
  const has=(v,list)=>list.some(n=>v.name.toLowerCase().includes(n));
  let v=null;
  if(gender==='male')v=sl.find(x=>has(x,MALE));
  if(gender==='female')v=sl.find(x=>has(x,FEMALE));
  return {voice:v||sl.find(x=>x.default)||sl[0]||null,matched:!!v,listLoaded:vs.length>0};
}
function speak(text,lang,info){
  if(!voiceOn){resumeListening();return;}
  const loud=$('outMode').value==='speaker';
  const gender=info&&info.gender;
  const pick=pickVoice(lang||'en-US',gender);
  if(pick.listLoaded&&!pick.voice){log('no voice for '+lang+' here');setStatus('📝 No voice for this language on this device, text only');setTimeout(resumeListening,2500);return;}
  busy=true;speaking=true;
  setStatus('🔊 Speaking...');
  if(loud)send({type:'hold',ms:est(text)});
  const u=new SpeechSynthesisUtterance(text);
  u.lang=lang||'en-US';
  if(pick.voice){u.voice=pick.voice;u.lang=pick.voice.lang||u.lang;}
  let pitch=1,rate=1;
  if(gender&&!pick.matched)pitch=gender==='male'?0.8:1.15;
  if(info&&info.energy==='high'){rate=1.08;pitch+=0.08;}
  else if(info&&info.energy==='low'){rate=0.92;pitch-=0.08;}
  u.pitch=Math.max(0.5,Math.min(1.8,pitch));u.rate=rate;
  log('voice: '+(pick.voice?pick.voice.name:'default')+' / '+(gender||'?'));
  const done=()=>setTimeout(resumeListening,loud?700:100);
  u.onend=done;
  u.onerror=e=>{log('voice error: '+(e.error||'unknown'));done();};
  speechSynthesis.speak(u);
}

/* ---------- microphone, hands-free ---------- */
function resumeListening(){
  collecting=false;buf=[];pre=[];silenceMs=0;speechMs=0;busy=false;speaking=false;
  const idle=()=>setStatus(micMuted?'🔇 Mic muted':'👂 Listening... just speak');
  if(on&&!String($('status').textContent).startsWith('🚫')&&!String($('status').textContent).startsWith('📝'))idle();
  else if(on)setTimeout(()=>{if(!busy&&!collecting)idle();},2500);
}
async function finish(){
  const tooShort=speechMs<MIN_SPEECH_MS;
  const chunks=buf;collecting=false;buf=[];pre=[];silenceMs=0;
  if(tooShort){speechMs=0;if(on)setStatus('👂 Listening... just speak');return;}
  speechMs=0;busy=true;setStatus('Thinking...');
  let len=0;chunks.forEach(c=>len+=c.length);
  const all=new Float32Array(len);let p=0;
  chunks.forEach(c=>{all.set(c,p);p+=c.length;});
  const data=b64(toWav16k(all,ctx.sampleRate));
  if(isGuest){
    const turn=++turnCounter;
    try{await sendAudio(data);}catch(e){log('ERR '+e.message);}
    setTimeout(()=>{if(turn===turnCounter&&busy&&!speaking)resumeListening();},20000);
  }else{await handleAudio(data,'host');}
}
function onAudio(e){
  const d=new Float32Array(e.inputBuffer.getChannelData(0));
  let sum=0;for(let i=0;i<d.length;i++)sum+=d[i]*d[i];
  const rms=Math.sqrt(sum/d.length),ms=d.length/ctx.sampleRate*1000;
  $('meter').style.width=micMuted?'0%':Math.min(100,(rms/(thr*2))*100)+'%';
  if(calibrating){
    calSum+=rms;calN++;calMs+=ms;
    setStatus('🤫 Stay quiet for 1 second...');
    if(calMs>=1000){calibrating=false;thr=Math.min(0.02,Math.max(0.006,(calSum/calN)*2.5));resumeListening();}
    return;
  }
  if(micMuted)return;
  if(performance.now()<holdUntil){collecting=false;buf=[];pre=[];speechMs=0;silenceMs=0;return;}
  if(busy)return;
  const loud=collecting?(rms>thr*0.5):(rms>thr);
  if(loud){
    if(!collecting){collecting=true;buf=[...pre];pre=[];setStatus('🎙 Hearing you...');}
    speechMs+=ms;silenceMs=0;buf.push(d);
  }else if(collecting){
    buf.push(d);silenceMs+=ms;
    if(silenceMs>PAUSE_MS)finish();
  }else{pre.push(d);if(pre.length>3)pre.shift();}
  if(collecting&&buf.length*d.length/ctx.sampleRate>MAX_SEC)finish();
}

$('btn').onclick=async()=>{
  try{
    if(!on){
      try{const u0=new SpeechSynthesisUtterance('.');u0.volume=0;speechSynthesis.speak(u0);}catch(e){}
      stream=await navigator.mediaDevices.getUserMedia({audio:true});
      ctx=new (window.AudioContext||window.webkitAudioContext)();
      await ctx.resume();
      const src=ctx.createMediaStreamSource(stream);
      proc=ctx.createScriptProcessor(4096,1,1);
      proc.onaudioprocess=onAudio;
      src.connect(proc);proc.connect(ctx.destination);
      on=true;$('btn').textContent='⏹ Stop conversation';$('btn').classList.add('on');
      calibrating=true;calMs=0;calSum=0;calN=0;busy=false;speaking=false;
    }else{
      on=false;busy=false;calibrating=false;
      proc.disconnect();stream.getTracks().forEach(t=>t.stop());ctx.close();
      speechSynthesis.cancel();
      $('btn').textContent='🎤 Start conversation';$('btn').classList.remove('on');
      setStatus('');$('meter').style.width='0';
    }
  }catch(err){setStatus('Error: '+err.message);log('ERR '+err.message);}
};
