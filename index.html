<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connect</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  body{font-family:sans-serif;text-align:center;padding:24px;background:#111;color:#fff}
  #qr{display:inline-block;background:#fff;padding:12px;border-radius:12px;margin:12px}
  #qr:empty{display:none}
  button{font-size:20px;padding:14px 28px;border:0;border-radius:30px;background:#4f8cff;color:#fff;margin-top:12px}
  #status{font-size:22px;margin:12px 0}
  #link{font-size:12px;color:#888;word-break:break-all}
  #log{font-size:20px}
  #dbg{font-size:14px;color:#aaa}
</style>
</head>
<body>
<h2>Connect <span style="font-size:14px;color:#3ddc84">v3 supabase</span></h2>
<div id="status">Starting...</div>
<div id="qr"></div>
<p id="link"></p>
<button id="hi" style="display:none">👋 Send hello</button>
<p id="log"></p>
<p id="dbg"></p>

<script>
const SUPABASE_URL = 'https://jxtrjjsnyoyrvktjebbx.supabase.co';
const SUPABASE_KEY = 'sb_publishable_MKpbfMzNoDUJc1iwXUA0fw_yHhZxKH3';

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const params = new URLSearchParams(location.search);
let room = params.get('room');
const isGuest = !!room;
if(!room) room = Math.random().toString(36).slice(2,8);
const me = Math.random().toString(36).slice(2,8);

const status = document.getElementById('status'), log = document.getElementById('log'), dbg = document.getElementById('dbg');
let isConnected = false;

const ch = sb.channel('room-' + room, {config:{broadcast:{self:false}}});

function send(payload){ ch.send({type:'broadcast', event:'msg', payload:Object.assign({from:me}, payload)}); }

function connected(){
  if(isConnected) return;
  isConnected = true;
  status.textContent = '✅ Connected!';
  document.getElementById('qr').innerHTML = '';
  document.getElementById('link').textContent = '';
  document.getElementById('hi').style.display = 'inline-block';
  try{ navigator.vibrate && navigator.vibrate([200,100,200]); }catch(e){}
}

ch.on('broadcast', {event:'msg'}, ({payload}) => {
  if(payload.from === me) return;
  if(payload.type === 'join' && !isGuest){ connected(); send({type:'welcome'}); }
  else if(payload.type === 'welcome' && isGuest){ connected(); }
  else if(payload.type === 'hello'){
    log.textContent = 'Received: ' + payload.text;
    try{ navigator.vibrate && navigator.vibrate(100); }catch(e){}
  }
});

ch.subscribe(s => {
  dbg.textContent = 'Relay: ' + s;
  if(s === 'SUBSCRIBED'){
    if(isGuest){
      status.textContent = 'Connecting...';
      send({type:'join'});
      setTimeout(() => { if(!isConnected) status.textContent = 'Still trying... is the other page open?'; }, 8000);
    } else {
      status.textContent = "Scan this with your friend's phone camera";
      const url = location.origin + location.pathname + '?room=' + room;
      new QRCode(document.getElementById('qr'), {text:url, width:220, height:220});
      document.getElementById('link').textContent = url;
    }
  } else if(s === 'CHANNEL_ERROR' || s === 'TIMED_OUT'){
    status.textContent = 'Error: could not reach the relay (' + s + ')';
  }
});

document.getElementById('hi').onclick = () => {
  send({type:'hello', text:'Hello 👋 from ' + (isGuest ? 'guest' : 'host')});
};
</script>
</body>
</html>
