<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connect</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  body{font-family:sans-serif;text-align:center;padding:24px;background:#111;color:#fff}
  #qr{display:inline-block;background:#fff;padding:12px;border-radius:12px;margin:12px}
  #qr:empty{display:none}
  button{font-size:20px;padding:14px 28px;border:0;border-radius:30px;background:#4f8cff;color:#fff;margin-top:12px}
  #status{font-size:22px;margin:12px 0}
  #link{font-size:12px;color:#888;word-break:break-all}
  #log{font-size:20px}
  #dbg{font-size:14px;color:#aaa}
</style>
</head>
<body>
<h2>Connect <span style="font-size:14px;color:#3ddc84">v2 relay</span></h2>
<div id="status">Starting...</div>
<div id="qr"></div>
<p id="link"></p>
<button id="hi" style="display:none">👋 Send hello</button>
<p id="log"></p>
<p id="dbg"></p>

<script>
const params = new URLSearchParams(location.search);
const joinId = params.get('join');
const status = document.getElementById('status'), log = document.getElementById('log'), dbg = document.getElementById('dbg');
let conn = null, isConnected = false;

function connected(c){
  if(isConnected) return;
  isConnected = true;
  conn = c;
  status.textContent = '✅ Connected!';
  document.getElementById('qr').innerHTML = '';
  document.getElementById('link').textContent = '';
  document.getElementById('hi').style.display = 'inline-block';
  try{ navigator.vibrate && navigator.vibrate([200,100,200]); }catch(e){}
  c.on('data', d => {
    log.textContent = 'Received: ' + d;
    try{ navigator.vibrate && navigator.vibrate(100); }catch(e){}
  });
  c.on('close', () => { status.textContent = 'Disconnected'; });
}

const peer = new Peer({
  config: {
    iceServers: [
      {urls:'stun:stun.l.google.com:19302'},
      {urls:'stun:openrelay.metered.ca:80'},
      {urls:'turn:openrelay.metered.ca:80', username:'openrelayproject', credential:'openrelayproject'},
      {urls:'turn:openrelay.metered.ca:443', username:'openrelayproject', credential:'openrelayproject'},
      {urls:'turn:openrelay.metered.ca:443?transport=tcp', username:'openrelayproject', credential:'openrelayproject'}
    ]
  }
});

peer.on('error', e => { status.textContent = 'Error: ' + e.type; });
peer.on('open', id => {
  if(joinId){
    status.textContent = 'Connecting...';
    const c = peer.connect(joinId, {reliable:true});
    c.on('open', () => connected(c));
    c.on('error', e => { dbg.textContent = 'Conn error: ' + e; });
    let secs = 0;
    const t = setInterval(() => {
      secs++;
      const pc = c.peerConnection;
      dbg.textContent = 'Waited ' + secs + 's | network state: ' + (pc ? pc.iceConnectionState : 'none');
      if(isConnected) { clearInterval(t); dbg.textContent=''; }
      if(secs === 20 && !isConnected) status.textContent = 'Still trying... network may be blocking';
    }, 1000);
  } else {
    status.textContent = "Scan this with your friend's phone camera";
    const url = location.origin + location.pathname + '?join=' + id;
    new QRCode(document.getElementById('qr'), {text: url, width: 220, height: 220});
    document.getElementById('link').textContent = url;
  }
});
peer.on('connection', c => c.on('open', () => connected(c)));

document.getElementById('hi').onclick = () => {
  if(conn) conn.send('Hello 👋 from ' + (joinId ? 'guest' : 'host'));
};
</script>
</body>
</html>s
